[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Courses Manager"
readme = "../README.md"
authors = [
    { name = "lleon", email = "phongepic1107@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "pydantic-settings>=2.10.1",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
